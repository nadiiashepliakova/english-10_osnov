<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Grade 10 (основний рівень)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f7f9fc 0%, #e9eef4 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      color: #0a2942;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem 1.2rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1.25;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
      word-break: break-word;
    }

    h1 .line {
      display: block;
      padding-bottom: 0.3rem;
      border-bottom: 3px solid #2f7d8c;
      margin-bottom: 0.3rem;
    }

    h1 .line:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    /* Кнопка на розділ «Людські взаємини» */
    .section-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #2f7d8c;
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 600;
      text-decoration: none;
      padding: 1rem 2.2rem;
      border-radius: 60px;
      box-shadow: 0 10px 20px -8px rgba(47, 125, 140, 0.6);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      border: 2px solid transparent;
    }

    .section-btn:hover {
      background: #1f5f6b;
      transform: translateY(-3px);
      box-shadow: 0 16px 26px -10px rgba(31, 95, 107, 0.7);
    }

    .section-btn:active {
      transform: translateY(-1px);
    }

    .section-btn:focus-visible {
      outline: 3px solid #b3d9e0;
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      .section-btn {
        font-size: 1.05rem;
        padding: 0.8rem 1.6rem;
      }
    }
  </style>
</head>
<body>
  <h1>
    <span class="line">English</span>
    <span class="line">Grade 10</span>
    <span class="line">(основний рівень)</span>
  </h1>

  <!-- Кнопка з переходом на розділ «Людські взаємини» -->
  <a href="https://nadiiashepliakova.github.io/relationship_osn/" class="section-btn">
    <span>Людські взаємини</span>
  </a>
</body>
</html>
